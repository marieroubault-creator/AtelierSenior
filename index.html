<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Senior</title>
<style>
:root{--bg:#141414;--fg:#fff;--muted:#b3b3b3;--red:#e50914;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif}
.hidden{display:none!important}
/* Profils */
#profiles{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;position:relative;background:radial-gradient(ellipse at 15% 0%,#b20710 0%,#0000 55%),radial-gradient(ellipse at 100% 100%,#8a050c 0%,#0000 50%),linear-gradient(160deg,#2a0407 0%,#000 55%,#1c0305 100%)}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:4%;display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 16px 8px 10px;box-shadow:0 4px 18px #0006}
.brand img{height:clamp(34px,6vw,52px);display:block}
.brand .wm{font-weight:800;font-size:clamp(18px,3.4vw,28px);letter-spacing:.3px;color:#1e2a78}
#profiles h1{font-size:clamp(28px,5vw,52px);font-weight:500;margin:0 0 36px}
.grid{display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,32px);justify-content:center}
.profile{background:none;border:0;color:var(--muted);cursor:pointer;width:clamp(96px,18vw,150px);font-size:clamp(14px,2vw,18px)}
.avatar{width:100%;aspect-ratio:1;border-radius:6px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:clamp(36px,7vw,64px);font-weight:700;border:3px solid transparent;transition:.15s}
.profile:hover,.profile:focus-visible{color:#fff;outline:none}
.profile:hover .avatar,.profile:focus-visible .avatar{border-color:#fff;transform:scale(1.04)}
.profile span{display:block;margin-top:10px}

#profiles{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 100px);padding-bottom:50px}
#profiles h1{margin:44px 0 28px}
.sub{font-size:clamp(18px,2.6vw,24px);font-weight:600;margin:0 0 14px;text-align:left;width:min(820px,100%)}
.carousel{position:relative;width:min(820px,100%);aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:0 14px 44px #000b;background:#111}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s;background-size:cover;background-position:center;border:0;cursor:pointer;color:#fff;text-align:left;padding:0;width:100%}
.slide.on{opacity:1;pointer-events:auto}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 34px;background:linear-gradient(0deg,#000e,#0000);font-size:clamp(18px,3.2vw,30px);font-weight:700}
.slide .cap small{display:block;color:#ddd;font-weight:400;font-size:clamp(12px,1.6vw,15px);margin-top:4px}
.slide .bp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:clamp(48px,9vw,72px);aspect-ratio:1;border-radius:50%;background:#0009;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,3vw,28px);transition:.2s}
.slide:hover .bp{background:var(--red);border-color:var(--red);transform:translate(-50%,-50%) scale(1.1)}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:26px;line-height:1;cursor:pointer}
.nav:hover{background:var(--red)}
.nav.prev{left:10px}.nav.next{right:10px}
.dots{position:absolute;bottom:12px;left:0;right:0;z-index:3;display:flex;gap:8px;justify-content:center}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:#fff6;cursor:pointer}
.dots button.on{background:var(--red);width:24px;border-radius:5px}
.pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;pointer-events:none;background:#111}
/* Navigation */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 4%;background:linear-gradient(#000c,#0000)}
.logo{color:var(--red);font-weight:800;font-size:clamp(20px,4vw,30px);letter-spacing:1px}
.me{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;cursor:pointer;font-size:14px}
.me .avatar{width:34px;font-size:16px;border-radius:4px;border:0}
/* Hero */
.hero{margin-top:-60px;min-height:52vh;display:flex;flex-direction:column;justify-content:flex-end;padding:90px 4% 40px;background:linear-gradient(0deg,var(--bg),#0000 60%),linear-gradient(120deg,#3a0d12,#111 70%)}
.hero h2{font-size:clamp(28px,6vw,60px);margin:0 0 10px;max-width:14em}
.hero p{max-width:34em;color:#ddd;margin:0 0 18px;line-height:1.45}
.btn{background:#fff;color:#000;border:0;border-radius:4px;padding:10px 24px;font-size:16px;font-weight:700;cursor:pointer;width:max-content}
.btn:hover{background:#ddd}
/* Rangées */
.row{padding:0 4%;margin:26px 0}
.row h3{font-size:clamp(16px,2.4vw,22px);margin:0 0 10px}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scroll-snap-type:x proximity}
.card{flex:0 0 clamp(150px,22vw,260px);aspect-ratio:16/9;border-radius:4px;border:0;color:#fff;cursor:pointer;position:relative;overflow:hidden;background-size:cover;background-position:center;scroll-snap-align:start;transition:transform .15s;text-align:left;padding:0}
.card:hover,.card:focus-visible{transform:scale(1.07);z-index:2;outline:2px solid #fff}
.card .t{position:absolute;inset:auto 0 0 0;padding:22px 10px 8px;font-size:13px;font-weight:600;background:linear-gradient(0deg,#000d,#0000)}
.card .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#0008;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px}
/* Lecteur */
#player{position:fixed;inset:0;z-index:20;background:#000e;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:min(1000px,100%);background:#000;border-radius:8px;overflow:hidden;position:relative}
.box video{width:100%;display:block;aspect-ratio:16/9;background:#111}
.empty{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
.box h4{margin:0;padding:12px 16px;font-size:16px}
.close{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:20px;cursor:pointer}
</style>
</head>
<body>

<!-- ÉCRAN 1 : choix du profil -->
<section id="profiles">
  <div class="brand" id="brand"></div>
  <div class="sub">À l'affiche</div>
  <div class="carousel" id="carousel">
    <div id="slides"></div>
    <button class="nav prev" id="prev" aria-label="Précédent">‹</button>
    <button class="nav next" id="next" aria-label="Suivant">›</button>
    <div class="dots" id="dots"></div>
  </div>
  <h1>Qui regarde ?</h1>
  <div class="grid" id="profileGrid"></div>
</section>

<!-- ÉCRAN 2 : catalogue -->
<main id="browse" class="hidden">
  <header>
    <div class="logo">ATELIER SENIOR</div>
    <button class="me" id="switch" title="Changer de profil"><span id="meName"></span><div class="avatar" id="meAvatar"></div></button>
  </header>
  <section class="hero">
    <h2 id="heroTitle"></h2>
    <p id="heroText"></p>
    <button class="btn" id="heroPlay">▶ Lecture</button>
  </section>
  <div id="rows"></div>
</main>

<!-- Lecteur vidéo -->
<div id="player" class="hidden">
  <div class="box">
    <button class="close" id="closePlayer" aria-label="Fermer">✕</button>
    <div id="playerMedia"></div>
    <h4 id="playerTitle"></h4>
  </div>
</div>

function paintAvatar(el, p){
  el.style.backgroundImage = "none";
  el.style.backgroundColor = p.color;
  el.textContent = p.name.trim().charAt(0).toUpperCase();
  if(p.avatar){
    const im = new Image();
    im.onload = () => { el.style.backgroundImage = `url("${p.avatar}")`; el.textContent = ""; };
    im.src = p.avatar;
  }
}

PROFILES.forEach((p,i)=>{
  const b = document.createElement("button");
  b.className = "profile";
  b.innerHTML = `<div class="avatar"></div><span></span>`;
  b.querySelector("span").textContent = p.name;
  paintAvatar(b.querySelector(".avatar"), p);
  b.onclick = () => openProfile(i);
  $("profileGrid").appendChild(b);
});

function thumbStyle(v, i, color){
  const g = `linear-gradient(${120+i*25}deg, ${color}, #1b1b1b 75%)`;
  return v.thumb ? `background-image:url("${v.thumb}"),${g}` : `background-image:${g}`;
}

function attachPreview(el, v){
  const addVideo = () => {
    if(!v.src) return;
    const pv = document.createElement("video");
    pv.className = "pv"; pv.muted = true; pv.playsInline = true; pv.preload = "metadata";
    pv.setAttribute("aria-hidden","true");
    pv.src = v.src + "#t=1";
    el.insertBefore(pv, el.firstChild);
  };
  if(v.thumb){ const im = new Image(); im.onerror = addVideo; im.src = v.thumb; }
  else addVideo();
}

function openProfile(i){
  current = PROFILES[i];
  $("profiles").classList.add("hidden");
  $("browse").classList.remove("hidden");
  $("meName").textContent = current.name;
  paintAvatar($("meAvatar"), current);
  const vids = current.videos || VIDEOS;
  const first = vids[0];
  $("heroTitle").textContent = first ? first.title : "Bienvenue";
  $("heroText").textContent = `Sélection pour ${current.name}. Choisis une vidéo ci-dessous pour la lancer.`;
  $("heroPlay").onclick = () => first && play(first);

  const rows = $("rows"); rows.innerHTML = "";
  const groups = [
    ["Reprendre la lecture", vids.slice(0,3)],
    [`Sélection de ${current.name}`, vids],
    ["Tendances actuelles", [...vids].reverse()]
  ];
  groups.forEach(([title, list])=>{
    if(!list.length) return;
    const r = document.createElement("section"); r.className = "row";
    r.innerHTML = `<h3></h3><div class="scroller"></div>`;
    r.querySelector("h3").textContent = title;
    list.forEach((v,k)=>{
      const c = document.createElement("button"); c.className = "card";
      c.setAttribute("style", thumbStyle(v,k,current.color));
      c.innerHTML = `<div class="play">▶</div><div class="t"></div>`;
      c.querySelector(".t").textContent = v.title;
      attachPreview(c, v);
      c.onclick = () => play(v);
      r.querySelector(".scroller").appendChild(c);
    });
    rows.appendChild(r);
  });
  window.scrollTo(0,0);
}

function play(v){
  $("playerTitle").textContent = v.title;
  const m = $("playerMedia"); m.innerHTML = "";
  if(v.src){
    const el = document.createElement("video");
    el.src = v.src; el.controls = true; el.autoplay = true; el.playsInline = true;
    if(v.thumb) el.poster = v.thumb;
    el.onerror = () => { m.innerHTML = `<div class="empty">Vidéo introuvable — vérifie le nom du fichier.</div>`; };
    m.appendChild(el);
  } else {
    m.innerHTML = `<div class="empty">Vidéo à venir — ajoute le lien du fichier dans la configuration.</div>`;
  }
  $("player").classList.remove("hidden");
}
function closePlayer(){
  const v = $("playerMedia").querySelector("video"); if(v) v.pause();
  $("playerMedia").innerHTML = ""; $("player").classList.add("hidden");
}
$("closePlayer").onclick = closePlayer;
$("player").onclick = e => { if(e.target === $("player")) closePlayer(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") closePlayer(); });
$("switch").onclick = () => { $("browse").classList.add("hidden"); $("profiles").classList.remove("hidden"); };

/* Carrousel de la page d'accueil */
(function(){
  const slides=$("slides"), dots=$("dots"), palette=["#b20710","#7a0a2a","#4a0d12","#8a3a05","#5a0f3a"];
  let idx=0, timer;
  VIDEOS.forEach((v,i)=>{
    const b=document.createElement("button"); b.className="slide";
    { const g=`linear-gradient(${120+i*30}deg,${palette[i%palette.length]},#111 80%)`; b.setAttribute("style", v.thumb?`background-image:url("${v.thumb}"),${g}`:`background-image:${g}`); }
    b.innerHTML='<div class="bp">▶</div><div class="cap"></div>';
    b.querySelector(".cap").innerHTML="";
    const t=document.createElement("span"); t.textContent=v.title;
    const sm=document.createElement("small"); sm.textContent=(i+1)+" / "+VIDEOS.length;
    b.querySelector(".cap").append(t,sm);
    attachPreview(b, v);
    b.onclick=()=>play(v);
    slides.appendChild(b);
    const d=document.createElement("button"); d.setAttribute("aria-label","Vidéo "+(i+1)); d.onclick=()=>{go(i);restart();};
    dots.appendChild(d);
  });
  function go(n){
    idx=(n+VIDEOS.length)%VIDEOS.length;
    [...slides.children].forEach((e,i)=>e.classList.toggle("on",i===idx));
    [...dots.children].forEach((e,i)=>e.classList.toggle("on",i===idx));
  }
  function restart(){clearInterval(timer);timer=setInterval(()=>go(idx+1),4500);}
  $("prev").onclick=()=>{go(idx-1);restart();};
  $("next").onclick=()=>{go(idx+1);restart();};
  $("carousel").onmouseenter=()=>clearInterval(timer);
  $("carousel").onmouseleave=restart;
  go(0);restart();
})();
</script>
